services:
  - type: web
    name: resonance-admin-portal
    runtime: node
    plan: starter
    region: oregon
    branch: mark.dev
    buildCommand: pnpm install --frozen-lockfile && pnpm turbo run build --filter=@resonance/admin-portal
    startCommand: pnpm --filter @resonance/admin-portal start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
    domains:
      - admin.resonancecleaningservices.org

  - type: web
    name: resonance-client-portal
